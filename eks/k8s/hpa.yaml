# HPA — "Keep average CPU across all url-shortener pods below 50%."
#
# 50% of the 100m request = 50m millicores per pod. When the average
# across all pods exceeds that, HPA adds a replica. When it drops back,
# HPA scales down (with a 5-minute cooldown to avoid flapping).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: url-shortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: url-shortener
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50