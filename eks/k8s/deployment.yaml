# Deployment — "I want 2 copies of my app running at all times."
#
# This is the Kubernetes equivalent of the ASG + launch template. You declare
# what you want (2 replicas, this image, these health checks) and Kubernetes
# makes it happen — scheduling pods onto nodes, restarting them if they crash,
# rolling them out when you change the image.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  labels:
    app: url-shortener
spec:
  replicas: 2

  # "Which pods does this Deployment manage?" — any pod with the label
  # app=url-shortener. Same idea as the ASG knowing which instances it owns.
  selector:
    matchLabels:
      app: url-shortener
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    # Every pod created by this Deployment gets this label.
    metadata:
      labels:
        app: url-shortener
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: url-shortener
          image: __ECR_IMAGE__
          ports:
            - containerPort: 3000

          # Environment variables — same ones the docker run command used.
          env:
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            # DATABASE_URL comes from the Secret, not hardcoded here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL

          # --- health checks ------------------------------------------------
          # Same endpoints your app already exposes. Kubernetes uses these the
          # same way the ALB did — but with the liveness/readiness split that
          # your app was designed for.
          #
          # Liveness: "Is the process alive?" — no DB check. If this fails
          # repeatedly, Kubernetes kills and restarts the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

          lifecycle:
            preStop:
              sleep:
                seconds: 15

          # Readiness: "Can it serve traffic?" — checks the DB. If this fails,
          # the pod is removed from the Service (no traffic routed to it) but
          # NOT killed. Same behaviour as the ALB target group health check.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5      # tolerate a queued event loop
            failureThreshold: 3    # explicit: ~30s of failures before NotReady

          # --- resource requests --------------------------------------------
          # "How much CPU and memory does each pod need?" Kubernetes uses this
          # to decide which node has room for the pod. Without these, the
          # scheduler guesses — and often guesses wrong on small instances.
          resources:
            requests:
              cpu: "100m"       # 100 millicores = 10% of one CPU core
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
